<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu Family Lagoon — welcome home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Crimson+Text:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#241a12; overflow:hidden;
    font-family:'Crimson Text', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position:fixed; inset:0; }
  svg.room { width:100%; height:100%; display:block; }

  /* ---------- ambient animations ---------- */
  .mote { animation: drift 12s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translate(0,0); opacity:.15; }
    50% { transform: translate(22px,-38px); opacity:.5; }
  }
  .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 6s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.4deg); } }

  /* ---------- hotspots ---------- */
  .hotspot { cursor:pointer; outline:none; }
  .hotspot .dot {
    fill:#ffd97a; stroke:#fff8ea; stroke-width:5;
    filter: drop-shadow(0 0 14px rgba(255,217,122,.95));
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { r:17; opacity:.95; } 50% { r:22; opacity:.65; } }
  .hotspot .ring {
    fill:none; stroke:#ffd97a; stroke-width:3; opacity:.75;
    transform-box: fill-box; transform-origin:center;
    animation: ringOut 2.4s ease-out infinite;
  }
  @keyframes ringOut { 0% { transform: scale(.55); opacity:.85; } 100% { transform: scale(1.5); opacity:0; } }
  .hotspot text {
    font-family:'Caveat', cursive; font-size:56px; font-weight:700;
    fill:#fff8ea; opacity:.92; pointer-events:none;
    paint-order: stroke; stroke:#3a2412; stroke-width:10px; stroke-linejoin:round;
  }
  .hotspot:hover text, .hotspot:focus text { opacity:1; }
  .hotspot:hover .dot { fill:#ffe9b8; }

  /* ---------- overlay UI ---------- */
  .title {
    position:absolute; top:26px; left:32px; color:#fff8ea;
    font-family:'Caveat', cursive; pointer-events:none;
    text-shadow:0 2px 16px rgba(40,20,5,.75), 0 1px 3px rgba(40,20,5,.8);
  }
  .title h1 { font-size:46px; font-weight:700; line-height:1; }
  .title p { font-size:24px; opacity:.9; font-weight:500; }
  .hint {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    background:rgba(42,26,14,.62); color:#ffe9c9;
    font-family:'Caveat', cursive; font-size:25px; font-weight:600;
    padding:9px 28px; border-radius:999px; border:1px solid rgba(255,217,122,.4);
    backdrop-filter: blur(6px); pointer-events:none;
    transition: opacity 1s ease; white-space:nowrap;
  }
  .hint.gone { opacity:0; }
  .credit {
    position:absolute; bottom:26px; right:28px; color:rgba(255,248,234,.75);
    font-family:'Caveat', cursive; font-size:20px; pointer-events:none;
    text-shadow:0 1px 8px rgba(40,20,5,.7);
  }

  /* ---------- music widget ---------- */
  .music-widget {
    position:absolute; right:24px; bottom:70px; width:308px;
    background:linear-gradient(150deg, #4a2f1c, #2a1a10);
    border:1px solid rgba(255,217,122,.32); border-radius:18px;
    padding:16px; display:flex; gap:14px; align-items:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    transform: translateY(24px); opacity:0; pointer-events:none;
    transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s ease;
    z-index:5;
  }
  .music-widget.open { transform:none; opacity:1; pointer-events:auto; }
  .vinyl-mini {
    width:74px; height:74px; border-radius:50%; flex:none; position:relative;
    background: radial-gradient(circle at center, #e8975a 0 16%, #17171c 17% 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .vinyl-mini::after {
    content:''; position:absolute; inset:10px; border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.05), inset 0 0 0 12px rgba(255,255,255,.04);
  }
  body.playing .vinyl-mini { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .track-info { flex:1; min-width:0; color:#ffe9c9; }
  .track-title { font-family:'Caveat', cursive; font-size:25px; font-weight:700; line-height:1.05; }
  .track-sub { font-size:14px; opacity:.65; font-style:italic; }
  .wbtn {
    width:44px; height:44px; border-radius:50%; border:none; flex:none; cursor:pointer;
    background:#e8975a; color:#2a1708; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .wbtn:active { transform:scale(.93); }
  .wclose {
    position:absolute; top:6px; right:10px; background:none; border:none; cursor:pointer;
    color:rgba(255,233,201,.6); font-size:16px; padding:4px;
  }
  @media (max-width:640px) {
    .title h1 { font-size:34px; } .title p { font-size:19px; }
    .hint { font-size:20px; bottom:20px; }
    .music-widget { right:12px; left:12px; width:auto; bottom:62px; }
    .hotspot text { font-size:62px; }
    .credit { display:none; }
  }
</style>
</head>
<body>
<div class="stage">
<svg class="room" viewBox="0 0 2814 1536" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cozy sunlit lofi anime room">
<defs>
  <radialGradient id="vignette" cx=".5" cy=".46" r=".85">
    <stop offset=".68" stop-color="#241a12" stop-opacity="0"/><stop offset="1" stop-color="#241a12" stop-opacity=".22"/>
  </radialGradient>
</defs>

<!-- ======== your artwork ======== -->
<image id="roomArt" x="0" y="0" width="2814" height="1536"
       href="static/lofi-room.jpg"
       xlink:href="static/lofi-room.jpg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       preserveAspectRatio="xMidYMid slice"/>

<!-- ======== hotspots ======== -->
<g id="hotspots">
  <g class="hotspot" id="hsMusic" tabindex="0" role="button" aria-label="Play family concert recording">
    <circle class="ring" cx="2445" cy="946" r="55"/>
    <circle class="dot" cx="2445" cy="946" r="17"/>
    <text x="2445" y="858" text-anchor="middle">tunes</text>
  </g>
  <g class="hotspot" id="hsDesk" tabindex="0" role="button" aria-label="Open resolutions">
    <circle class="ring" cx="1919" cy="1068" r="55"/>
    <circle class="dot" cx="1919" cy="1068" r="17"/>
    <text x="1919" y="980" text-anchor="middle">resolutions</text>
  </g>
  <g class="hotspot" id="hsPlay" tabindex="0" role="button" aria-label="Open games">
    <circle class="ring" cx="211" cy="1175" r="55"/>
    <circle class="dot" cx="211" cy="1175" r="17"/>
    <text x="211" y="1087" text-anchor="middle">play</text>
  </g>
  <g class="hotspot" id="hsMemories" tabindex="0" role="button" aria-label="Open holiday cards">
    <circle class="ring" cx="2153" cy="407" r="55"/>
    <circle class="dot" cx="2153" cy="407" r="17"/>
    <text x="2153" y="319" text-anchor="middle">memories</text>
  </g>
  <g class="hotspot" id="hsPortal" tabindex="0" role="button" aria-label="Open family portal">
    <circle class="ring" cx="633" cy="538" r="55"/>
    <circle class="dot" cx="633" cy="538" r="17"/>
    <text x="633" y="450" text-anchor="middle">portal</text>
  </g>
</g>

<!-- ======== sunbeam dust motes ======== -->
<g fill="#ffe9b8">
  <circle class="mote" cx="900" cy="900" r="7" style="animation-delay:0s"/>
  <circle class="mote" cx="1150" cy="1050" r="5" style="animation-delay:2.5s"/>
  <circle class="mote" cx="1350" cy="800" r="8" style="animation-delay:5s"/>
  <circle class="mote" cx="1050" cy="1150" r="5" style="animation-delay:7.5s"/>
  <circle class="mote" cx="1500" cy="1000" r="6" style="animation-delay:4s"/>
  <circle class="mote" cx="760" cy="1050" r="6" style="animation-delay:9s"/>
  <circle class="mote" cx="1250" cy="1250" r="5" style="animation-delay:1.5s"/>
</g>
<rect x="0" y="0" width="2814" height="1536" fill="url(#vignette)" pointer-events="none"/>
</svg>

<div class="title">
  <h1>yu family lagoon</h1>
  <p>welcome home — tap around the room</p>
</div>
<div class="hint" id="hint">tap the glowing dots to explore</div>
<div class="credit">a quiet corner of the internet</div>

<div class="music-widget" id="musicWidget" role="dialog" aria-label="Music player">
  <button class="wclose" id="wClose" aria-label="Close player">&times;</button>
  <div class="vinyl-mini"></div>
  <div class="track-info">
    <div class="track-title">family concert 2025</div>
    <div class="track-sub">live from the lagoon</div>
  </div>
  <button class="wbtn" id="playBtn" aria-label="Play">&#9654;</button>
</div>
</div>

<audio id="audio" preload="none" src="https://raw.githubusercontent.com/lfeyao/FamilyPortal/main/static/Concert_2025.mp3"></audio>

<script>
(function(){
  var body = document.body;
  var hint = document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('gone'); }, 7000);

  function hideHint(){ hint.classList.add('gone'); }

  function go(url){ window.location.href = url; }

  // lighter art for phones
  var art = document.getElementById('roomArt');
  if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) {
    art.setAttribute('href', 'static/lofi-room-sm.jpg');
    art.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', 'static/lofi-room-sm.jpg');
  }

  // ---- music widget ----
  var widget = document.getElementById('musicWidget');
  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  function setPlaying(p){
    if(p){ body.classList.add('playing'); playBtn.innerHTML = '&#10074;&#10074;'; playBtn.setAttribute('aria-label','Pause'); }
    else { body.classList.remove('playing'); playBtn.innerHTML = '&#9654;'; playBtn.setAttribute('aria-label','Play'); }
  }
  function toggleMusic(){
    widget.classList.add('open');
    hideHint();
    if(audio.paused){ audio.play().then(function(){ setPlaying(true); }).catch(function(){ setPlaying(false); }); }
    else { audio.pause(); setPlaying(false); }
  }
  function bindTap(el, fn){
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
    });
  }
  bindTap(document.getElementById('hsMusic'), toggleMusic);
  playBtn.addEventListener('click', function(){
    if(audio.paused){ audio.play().then(function(){ setPlaying(true); }).catch(function(){}); }
    else { audio.pause(); setPlaying(false); }
  });
  document.getElementById('wClose').addEventListener('click', function(){
    audio.pause(); setPlaying(false); widget.classList.remove('open');
  });
  audio.addEventListener('ended', function(){ setPlaying(false); });

  // ---- navigation (existing pages only) ----
  bindTap(document.getElementById('hsDesk'), function(){ hideHint(); go('resolutions.html'); });
  bindTap(document.getElementById('hsPortal'), function(){ hideHint(); go('portal.html'); });
  bindTap(document.getElementById('hsPlay'), function(){ hideHint(); go('games/index.html'); });
  bindTap(document.getElementById('hsMemories'), function(){ hideHint(); go('holiday-cards.html'); });

  // ---- subtle artwork parallax on desktop ----
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced && window.matchMedia('(pointer:fine)').matches){
    document.querySelector('.stage').addEventListener('mousemove', function(e){
      var dx = (e.clientX / window.innerWidth - .5) * 14;
      var dy = (e.clientY / window.innerHeight - .5) * 10;
      art.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
  }
})();
</script>
</body>
</html>
