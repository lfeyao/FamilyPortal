<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu Family Lagoon — welcome home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Crimson+Text:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#171224; overflow:hidden;
    font-family:'Crimson Text', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position:fixed; inset:0; }
  svg.room { width:100%; height:100%; display:block; }

  /* ---------- SVG animations ---------- */
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  .bulb { animation: bulbGlow 2.8s ease-in-out infinite; }
  @keyframes bulbGlow { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  .flick { animation: flick 4s steps(2) infinite; }
  @keyframes flick { 0%,100% { opacity:.95; } 50% { opacity:.35; } }
  .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 5.5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
  .steam { animation: steam 3.4s ease-in-out infinite; opacity:0; }
  .steam.s2 { animation-delay:1.1s; } .steam.s3 { animation-delay:2.2s; }
  @keyframes steam {
    0% { transform: translateY(6px); opacity:0; }
    35% { opacity:.55; }
    100% { transform: translateY(-26px); opacity:0; }
  }
  .mote { animation: drift 11s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translate(0,0); opacity:.12; }
    50% { transform: translate(14px,-26px); opacity:.4; }
  }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  .vinyl { transform-box: fill-box; transform-origin: center; }
  body.playing .vinyl { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lampGlow { animation: lampFlicker 6s ease-in-out infinite; }
  @keyframes lampFlicker { 0%,100% { opacity:.85; } 42% { opacity:.92; } 55% { opacity:.78; } 70% { opacity:.9; } }

  /* ---------- hotspots ---------- */
  .hotspot { cursor:pointer; outline:none; }
  .hotspot .dot {
    fill:#ffd97a; stroke:#fff3e2; stroke-width:3;
    filter: drop-shadow(0 0 8px rgba(255,217,122,.9));
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { r:11; opacity:.95; } 50% { r:14; opacity:.65; } }
  .hotspot .ring {
    fill:none; stroke:#ffd97a; stroke-width:2; opacity:.7;
    transform-box: fill-box; transform-origin:center;
    animation: ringOut 2.4s ease-out infinite;
  }
  @keyframes ringOut { 0% { transform: scale(.55); opacity:.8; } 100% { transform: scale(1.5); opacity:0; } }
  .hotspot text {
    font-family:'Caveat', cursive; font-size:30px; font-weight:600;
    fill:#fff6e8; opacity:.85; pointer-events:none;
    text-shadow: 0 2px 10px rgba(20,10,5,.55);
  }
  .hotspot:hover text, .hotspot:focus text { opacity:1; }
  .hotspot:hover .dot { fill:#ffe9b8; }

  /* ---------- overlay UI ---------- */
  .title {
    position:absolute; top:22px; left:28px; color:#fff3e2;
    font-family:'Caveat', cursive; pointer-events:none;
    text-shadow:0 2px 14px rgba(20,10,5,.6);
  }
  .title h1 { font-size:42px; font-weight:700; line-height:1; }
  .title p { font-size:22px; opacity:.85; font-weight:500; }
  .hint {
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:rgba(30,18,32,.55); color:#ffe9c9;
    font-family:'Caveat', cursive; font-size:24px; font-weight:600;
    padding:8px 26px; border-radius:999px; border:1px solid rgba(255,217,122,.35);
    backdrop-filter: blur(6px); pointer-events:none;
    transition: opacity 1s ease; white-space:nowrap;
  }
  .hint.gone { opacity:0; }
  .credit {
    position:absolute; bottom:24px; right:26px; color:rgba(255,243,226,.55);
    font-family:'Caveat', cursive; font-size:19px; pointer-events:none;
  }

  /* ---------- music widget ---------- */
  .music-widget {
    position:absolute; right:22px; bottom:64px; width:300px;
    background:linear-gradient(150deg, #3a2417, #241407);
    border:1px solid rgba(255,217,122,.28); border-radius:18px;
    padding:16px; display:flex; gap:14px; align-items:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    transform: translateY(24px); opacity:0; pointer-events:none;
    transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s ease;
    z-index:5;
  }
  .music-widget.open { transform:none; opacity:1; pointer-events:auto; }
  .vinyl-mini {
    width:74px; height:74px; border-radius:50%; flex:none; position:relative;
    background:
      radial-gradient(circle at center, #e8975a 0 16%, #17171c 17% 100%);
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .vinyl-mini::after {
    content:''; position:absolute; inset:10px; border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.05), inset 0 0 0 12px rgba(255,255,255,.04);
  }
  body.playing .vinyl-mini { animation: spin 2.6s linear infinite; }
  .track-info { flex:1; min-width:0; color:#ffe9c9; }
  .track-title { font-family:'Caveat', cursive; font-size:25px; font-weight:700; line-height:1.05; }
  .track-sub { font-size:14px; opacity:.65; font-style:italic; }
  .wbtn {
    width:44px; height:44px; border-radius:50%; border:none; flex:none; cursor:pointer;
    background:#e8975a; color:#2a1708; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .wbtn:active { transform:scale(.93); }
  .wclose {
    position:absolute; top:6px; right:10px; background:none; border:none; cursor:pointer;
    color:rgba(255,233,201,.6); font-size:16px; padding:4px;
  }
  @media (max-width:640px) {
    .title h1 { font-size:32px; } .title p { font-size:18px; }
    .hint { font-size:19px; bottom:18px; }
    .music-widget { right:12px; left:12px; width:auto; bottom:58px; }
    .hotspot text { font-size:34px; }
  }
</style>
</head>

<div class="music-widget" id="musicWidget" role="dialog" aria-label="Music player">
  <button class="wclose" id="wClose" aria-label="Close player">&times;</button>
  <div class="vinyl-mini"></div>
  <div class="track-info">
    <div class="track-title">family concert 2025</div>
    <div class="track-sub">live from the lagoon</div>
  </div>
  <button class="wbtn" id="playBtn" aria-label="Play">&#9654;</button>
</div>
</div>

<audio id="audio" preload="none" src="https://raw.githubusercontent.com/lfeyao/FamilyPortal/main/static/Concert_2025.mp3"></audio>

<script>
(function(){
  var body = document.body;
  var hint = document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('gone'); }, 7000);

  function hideHint(){ hint.classList.add('gone'); }

  function go(url){ window.location.href = url; }

  // ---- music widget ----
  var widget = document.getElementById('musicWidget');
  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  function setPlaying(p){
    if(p){ body.classList.add('playing'); playBtn.innerHTML = '&#10074;&#10074;'; playBtn.setAttribute('aria-label','Pause'); }
    else { body.classList.remove('playing'); playBtn.innerHTML = '&#9654;'; playBtn.setAttribute('aria-label','Play'); }
  }
  function toggleMusic(){
    widget.classList.add('open');
    hideHint();
    if(audio.paused){ audio.play().then(function(){ setPlaying(true); }).catch(function(){ setPlaying(false); }); }
    else { audio.pause(); setPlaying(false); }
  }
  function bindTap(el, fn){
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
    });
  }
  bindTap(document.getElementById('hsMusic'), toggleMusic);
  playBtn.addEventListener('click', function(){
    if(audio.paused){ audio.play().then(function(){ setPlaying(true); }).catch(function(){}); }
    else { audio.pause(); setPlaying(false); }
  });
  document.getElementById('wClose').addEventListener('click', function(){
    audio.pause(); setPlaying(false); widget.classList.remove('open');
  });
  audio.addEventListener('ended', function(){ setPlaying(false); });

  // ---- navigation ----
  bindTap(document.getElementById('hsJournal'), function(){ hideHint(); go('journal.html'); });
  bindTap(document.getElementById('hsPortal'), function(){ hideHint(); go('portal.html'); });
  bindTap(document.getElementById('hsGames'), function(){ hideHint(); go('games/index.html'); });
  bindTap(document.getElementById('hsMemories'), function(){ hideHint(); go('holiday-cards.html'); });

  // ---- shooting stars ----
  var layer = document.getElementById('shootingLayer');
  var NS = 'http://www.w3.org/2000/svg';
  function shoot(){
    var x = 660 + Math.random()*300, y = 100 + Math.random()*160;
    var line = document.createElementNS(NS,'line');
    line.setAttribute('x1', x); line.setAttribute('y1', y);
    line.setAttribute('x2', x+70); line.setAttribute('y2', y-26);
    line.setAttribute('stroke', '#fff6e8'); line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round'); line.setAttribute('opacity', '0');
    layer.appendChild(line);
    var t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      var p = (ts - t0) / 900;
      if(p >= 1){ line.remove(); return; }
      var dx = p*130, fade = p < .2 ? p/.2 : 1-(p-.2)/.8;
      line.setAttribute('x1', x - dx); line.setAttribute('y1', y + dx*.37);
      line.setAttribute('x2', x+70 - dx); line.setAttribute('y2', y-26 + dx*.37);
      line.setAttribute('opacity', Math.max(0, fade));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    setTimeout(shoot, 6000 + Math.random()*9000);
  }
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced) setTimeout(shoot, 2500);

  // ---- subtle window parallax on desktop ----
  if(!reduced && window.matchMedia('(pointer:fine)').matches){
    var win = document.getElementById('windowHot');
    document.querySelector('.stage').addEventListener('mousemove', function(e){
      var dx = (e.clientX / window.innerWidth - .5) * 10;
      var dy = (e.clientY / window.innerHeight - .5) * 8;
      win.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
  }
})();
</script>
