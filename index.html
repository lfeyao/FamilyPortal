<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yu Family Lagoon — welcome home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Crimson+Text:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#241a12; overflow:hidden;
    font-family:'Crimson Text', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    position:fixed; inset:0; width:100%;
    overscroll-behavior:none; touch-action:manipulation;
  }
  .stage { position:fixed; inset:0; }
  svg.room { width:100%; height:100%; display:block; }

  /* ---------- ambient animations ---------- */
  .mote { animation: drift 12s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translate(0,0); opacity:.15; }
    50% { transform: translate(22px,-38px); opacity:.5; }
  }
  .sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 6s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.4deg); } }

  /* ---------- hotspots ---------- */
  .hotspot { cursor:pointer; outline:none; }
  .hotspot .dot {
    fill:#ffdf9e; opacity:.45;
    transition:opacity .25s ease;
  }
  .hotspot:hover .dot, .hotspot:active .dot, .hotspot:focus .dot { opacity:1; }
  .hotspot .ring {
    fill:none; stroke:#ffdf9e; stroke-width:2; opacity:0;
    transform-box: fill-box; transform-origin:center;
    animation: ringSoft 6s ease-out infinite;
  }
  @keyframes ringSoft {
    0% { transform: scale(.35); opacity:0; }
    12% { opacity:.3; }
    45% { transform: scale(1.1); opacity:0; }
    100% { transform: scale(1.1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hotspot .ring, .rotate-phone, .mote { animation:none; }
    .hotspot .ring { opacity:0; }
    .hotspot .dot { opacity:.7; }
  }
  .hotspot text {
    font-family:'Caveat', cursive; font-size:56px; font-weight:700;
    fill:#fff8ea; opacity:.92; pointer-events:none;
    paint-order: stroke; stroke:#3a2412; stroke-width:10px; stroke-linejoin:round;
  }
  .hotspot:hover text, .hotspot:focus text { opacity:1; }
  .hotspot:hover .dot { fill:#ffe9b8; }

  /* ---------- overlay UI ---------- */
  .hint {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    background:rgba(42,26,14,.62); color:#ffe9c9;
    font-family:'Caveat', cursive; font-size:25px; font-weight:600;
    padding:9px 28px; border-radius:999px; border:1px solid rgba(255,217,122,.4);
    backdrop-filter: blur(6px); pointer-events:none;
    transition: opacity 1s ease; white-space:nowrap;
  }
  .hint.gone { opacity:0; }
  #lofiToast { bottom:84px; }
  #micEgg:focus { outline:none; }

  /* ---------- rotate prompt (portrait phones) ---------- */
  .rotate-prompt {
    position:fixed; inset:0; z-index:50;
    display:none; align-items:center; justify-content:center;
    background:rgba(26,17,10,.93);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    text-align:center; padding:32px;
  }
  .rotate-prompt.show { display:flex; }
  .rotate-inner { max-width:420px; }
  .rotate-phone {
    width:76px; height:76px; margin:0 auto 20px; display:block;
    animation: rotateHint 2.4s ease-in-out infinite;
  }
  @keyframes rotateHint {
    0%, 25% { transform: rotate(0deg); }
    65%, 100% { transform: rotate(90deg); }
  }
  .rotate-prompt h2 {
    font-family:'Caveat', cursive; font-size:42px; font-weight:700; color:#ffe9c9;
  }
  .rotate-prompt p {
    font-family:'Caveat', cursive; font-size:24px; font-weight:500;
    color:rgba(255,233,201,.72); margin-top:8px;
  }
  .rotate-dismiss {
    margin-top:26px; background:none; cursor:pointer;
    border:1px solid rgba(255,217,122,.5); border-radius:999px;
    color:#ffd97a; font-family:'Caveat', cursive; font-size:22px; font-weight:600;
    padding:8px 28px;
  }
  .rotate-dismiss:active { transform:scale(.96); }

  @media (max-width:640px) {
    .hint { font-size:20px; bottom:20px; }
    .hotspot text { font-size:62px; }
  }
</style>
</head>
<body>

<script>
(function(){
  var body = document.body;
  var hint = document.getElementById('hint');
  setTimeout(function(){ hint.classList.add('gone'); }, 7000);

  function hideHint(){ hint.classList.add('gone'); }

  function go(url){ window.location.href = url; }

  // lighter art for phones
  var art = document.getElementById('roomArt');
  if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) {
    art.setAttribute('href', 'static/lofi-room-sm.jpg');
    art.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', 'static/lofi-room-sm.jpg');
  }

  function bindTap(el, fn){
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
    });
  }

  // ---- navigation (existing pages only) ----
  bindTap(document.getElementById('hsDesk'), function(){ hideHint(); go('os.html'); });
  bindTap(document.getElementById('hsGames'), function(){ hideHint(); go('games/index.html'); });
  bindTap(document.getElementById('hsMemories'), function(){ hideHint(); go('holiday-cards.html'); });
  bindTap(document.getElementById('hsTravel'), function(){ hideHint(); window.open('https://travelnotes-423.pages.dev', '_blank', 'noopener'); });
  bindTap(document.getElementById('hsTwins'), function(){ hideHint(); window.open('https://yutwin.github.io', '_blank', 'noopener'); });

  // ---- mic easter egg: Lofi Cafe radio dial (tap mic to change station) ----
  var lofiAudio = document.getElementById('lofiAudio');
  var lofiToast = document.getElementById('lofiToast');
  var lofiStations = [
    { name: 'Japanese Lofi', url: 'https://radio.loficafe.net/listen/japanese-lofi/radio.mp3' },
    { name: 'Chilling',       url: 'https://radio.loficafe.net/listen/chilling/radio.mp3' },
    { name: 'Studying',       url: 'https://radio.loficafe.net/listen/studying/radio.mp3' },
    { name: 'Working',        url: 'https://radio.loficafe.net/listen/working/radio.mp3' },
    { name: 'Sleeping',       url: 'https://radio.loficafe.net/listen/sleeping/radio.mp3' },
    { name: 'Gaming',         url: 'https://radio.loficafe.net/listen/gaming/radio.mp3' }
  ];
  var lofiIdx = -1; // -1 = off; otherwise index into lofiStations
  function lofiToastMsg(m){
    if(m){ lofiToast.textContent = m; lofiToast.style.display = 'block'; }
    else { lofiToast.style.display = 'none'; }
  }
  function lofiPlayStation(){
    lofiAudio.src = lofiStations[lofiIdx].url;
    var pr = lofiAudio.play();
    if(pr && pr.catch){ pr.catch(function(){ lofiNextStation(); }); }
  }
  function lofiNextStation(){
    // dialling past the last station turns it off; next tap restarts at Japanese Lofi
    lofiIdx++;
    if(lofiIdx >= lofiStations.length){
      lofiIdx = -1;
      lofiAudio.pause();
      lofiAudio.removeAttribute('src');
      lofiToastMsg('lofi off');
      setTimeout(function(){ if(lofiIdx < 0) lofiToastMsg(''); }, 2000);
      return;
    }
    lofiToastMsg('\u266A ' + lofiStations[lofiIdx].name);
    lofiPlayStation();
  }
  lofiAudio.addEventListener('error', function(){ if(lofiIdx >= 0) lofiNextStation(); });
  function dialLofi(){
    hideHint();
    stopSara();
    stopJewel();
    stopLala();
    stopFf7();
    stopJinx();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();
    lofiNextStation();
  }
  bindTap(document.getElementById('micEgg'), dialLofi);

  // ---- album easter egg: Good Grief frame plays Sara Bareilles ----
  // Salt Then Sour Then Sweet (feat. Brandi Carlile) — official audio,
  // embeddable per YouTube oEmbed. Hidden 2px iframe; the tap is the
  // user gesture that permits autoplay with sound.
  var albumEgg = document.getElementById('albumEgg');
  var saraFrame = null, saraTimer = null;
  var SARA_VIDEO = '_kGptPiFO54';
  function stopSara(){
    if(saraFrame){ saraFrame.remove(); saraFrame = null; }
    if(saraTimer){ clearTimeout(saraTimer); saraTimer = null; }
  }
  function toggleSara(){
    hideHint();
    if(saraFrame){ stopSara(); lofiToastMsg(''); return; }
    if(lofiIdx >= 0){ lofiIdx = -1; lofiAudio.pause(); lofiAudio.removeAttribute('src'); }
    stopJewel();
    stopLala();
    stopFf7();
    stopJinx();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();
    saraFrame = document.createElement('iframe');
    saraFrame.setAttribute('src', 'https://www.youtube.com/embed/' + SARA_VIDEO + '?autoplay=1&rel=0');
    saraFrame.setAttribute('allow', 'autoplay; encrypted-media');
    saraFrame.setAttribute('title', 'Salt Then Sour Then Sweet');
    saraFrame.style.cssText = 'position:absolute;width:2px;height:2px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(saraFrame);
    lofiToastMsg('\u266A Salt Then Sour Then Sweet \u2014 Sara Bareilles');
    saraTimer = setTimeout(function(){ stopSara(); lofiToastMsg(''); }, 210000);
  }
  bindTap(albumEgg, toggleSara);

  // ---- jewel easter egg: Jewel poster plays Foolish Games ----
  // Foolish Games (Official HD Music Video, Jewel channel),
  // embeddable per YouTube oEmbed.
  // Hidden 2px iframe; the tap is the user gesture that permits autoplay.
  var jewelEgg = document.getElementById('jewelEgg');
  var jewelFrame = null, jewelTimer = null;
  var JEWEL_VIDEO = 'UNoouLa7uxA';
  function stopJewel(){
    if(jewelFrame){ jewelFrame.remove(); jewelFrame = null; }
    if(jewelTimer){ clearTimeout(jewelTimer); jewelTimer = null; }
  }
  function toggleJewel(){
    hideHint();
    if(jewelFrame){ stopJewel(); lofiToastMsg(''); return; }
    stopSara();
    stopLala();
    stopFf7();
    stopJinx();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();
    if(lofiIdx >= 0){ lofiIdx = -1; lofiAudio.pause(); lofiAudio.removeAttribute('src'); }
    jewelFrame = document.createElement('iframe');
    jewelFrame.setAttribute('src', 'https://www.youtube.com/embed/' + JEWEL_VIDEO + '?autoplay=1&rel=0');
    jewelFrame.setAttribute('allow', 'autoplay; encrypted-media');
    jewelFrame.setAttribute('title', 'Foolish Games');
    jewelFrame.style.cssText = 'position:absolute;width:2px;height:2px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(jewelFrame);
    lofiToastMsg('\u266A Foolish Games \u2014 Jewel');
    jewelTimer = setTimeout(function(){ stopJewel(); lofiToastMsg(''); }, 260000);
  }
  bindTap(jewelEgg, toggleJewel);

  // ---- la la land easter egg: record sleeve plays Mia & Sebastian's Theme ----
  // Justin Hurwitz - Topic audio, embeddable per YouTube oEmbed.
  // Hidden 2px iframe; the tap is the user gesture that permits autoplay.
  var lalaEgg = document.getElementById('lalaEgg');
  var lalaFrame = null, lalaTimer = null;
  var LALA_VIDEO = 'D3ovuBdbUqk';
  function stopLala(){
    if(lalaFrame){ lalaFrame.remove(); lalaFrame = null; }
    if(lalaTimer){ clearTimeout(lalaTimer); lalaTimer = null; }
  }
  function toggleLala(){
    hideHint();
    if(lalaFrame){ stopLala(); lofiToastMsg(''); return; }
    stopSara();
    stopJewel();
    stopFf7();
    stopJinx();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();
    if(lofiIdx >= 0){ lofiIdx = -1; lofiAudio.pause(); lofiAudio.removeAttribute('src'); }
    lalaFrame = document.createElement('iframe');
    lalaFrame.setAttribute('src', 'https://www.youtube.com/embed/' + LALA_VIDEO + '?autoplay=1&rel=0');
    lalaFrame.setAttribute('allow', 'autoplay; encrypted-media');
    lalaFrame.setAttribute('title', "Mia and Sebastian's Theme");
    lalaFrame.style.cssText = 'position:absolute;width:2px;height:2px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(lalaFrame);
    lofiToastMsg('\u266A Mia & Sebastian\u2019s Theme \u2014 Justin Hurwitz');
    lalaTimer = setTimeout(function(){ stopLala(); lofiToastMsg(''); }, 110000);
  }
  bindTap(lalaEgg, toggleLala);

  // ---- ff7 easter egg: FF7 poster plays Aerith's Theme ----
  // Aerith's Theme (Final Fantasy VII) - Nobuo Uematsu - Topic audio,
  // embeddable per YouTube oEmbed (Distant Worlds orchestral release).
  // Hidden 2px iframe; the tap is the user gesture that permits autoplay.
  var ff7Egg = document.getElementById('ff7Egg');
  var ff7Frame = null, ff7Timer = null;
  var FF7_VIDEO = 'I73aQlljM70';
  function stopFf7(){
    if(ff7Frame){ ff7Frame.remove(); ff7Frame = null; }
    if(ff7Timer){ clearTimeout(ff7Timer); ff7Timer = null; }
  }
  function toggleFf7(){
    hideHint();
    if(ff7Frame){ stopFf7(); lofiToastMsg(''); return; }
    stopSara();
    stopJewel();
    stopLala();
    stopJinx();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();
    if(lofiIdx >= 0){ lofiIdx = -1; lofiAudio.pause(); lofiAudio.removeAttribute('src'); }
    ff7Frame = document.createElement('iframe');
    ff7Frame.setAttribute('src', 'https://www.youtube.com/embed/' + FF7_VIDEO + '?autoplay=1&rel=0');
    ff7Frame.setAttribute('allow', 'autoplay; encrypted-media');
    ff7Frame.setAttribute('title', "Aerith's Theme");
    ff7Frame.style.cssText = 'position:absolute;width:2px;height:2px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(ff7Frame);
    lofiToastMsg('\u266A Aerith\u2019s Theme \u2014 Nobuo Uematsu');
    ff7Timer = setTimeout(function(){ stopFf7(); lofiToastMsg(''); }, 360000);
  }
  bindTap(ff7Egg, toggleFf7);

  // ---- jinx easter egg: postcard plays Paint The Town Blue (Arcane S2) ----
  // Official Netflix music video, embeddable per YouTube oEmbed.
  // Hidden 2px iframe; the tap is the user gesture that permits autoplay.
  var jinxEgg = document.getElementById('jinxEgg');
  var jinxFrame = null, jinxTimer = null;
  var JINX_VIDEO = 'pl2K9rvsS74';
  function stopJinx(){
    if(jinxFrame){ jinxFrame.remove(); jinxFrame = null; }
    if(jinxTimer){ clearTimeout(jinxTimer); jinxTimer = null; }
  }
  function toggleJinx(){
    hideHint();
    if(jinxFrame){ stopJinx(); lofiToastMsg(''); return; }
    stopSara();
    stopJewel();
    stopLala();
    stopFf7();
    stopEllie();
    stopXwing();
    stopR2();
    stopBall();

    ballFrame.setAttribute('src', 'https://www.youtube.com/embed/' + BALL_VIDEO + '?autoplay=1&rel=0');
    ballFrame.setAttribute('allow', 'autoplay; encrypted-media');
    ballFrame.setAttribute('title', 'Sekai ga Owaru made wa');
    ballFrame.style.cssText = 'position:absolute;width:2px;height:2px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none;';
    document.body.appendChild(ballFrame);
    lofiToastMsg('\u266A \u4e16\u754c\u304c\u7d42\u308b\u307e\u3067\u306f\u2026 \u2014 WANDS (Slam Dunk)');
    ballTimer = setTimeout(function(){ stopBall(); lofiToastMsg(''); }, 260000);
  }
  bindTap(ballEgg, toggleBall);

  // ---- rotate prompt: portrait touch devices ----
  var rotatePrompt = document.getElementById('rotatePrompt');
  function checkOrientation(){
    if(!window.matchMedia) return;
    var isCoarse = window.matchMedia('(pointer: coarse)').matches;
    var isPortrait = window.matchMedia('(orientation: portrait)').matches;
    var dismissed = false;
    try { dismissed = sessionStorage.getItem('rotateDismissed') === '1'; } catch(e){}
    rotatePrompt.classList.toggle('show', isCoarse && isPortrait && !dismissed);
  }
  document.getElementById('rotateDismiss').addEventListener('click', function(){
    try { sessionStorage.setItem('rotateDismissed', '1'); } catch(e){}
    rotatePrompt.classList.remove('show');
  });
  window.addEventListener('orientationchange', checkOrientation);
  window.addEventListener('resize', checkOrientation);
  checkOrientation();

})();
</script>
</body>
</html>
