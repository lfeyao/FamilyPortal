    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600&family=DM+Sans:wght@400;500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #faf8f3; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 20px; color: #2c2925; }
        .gate-card { background: #fff; border-radius: 24px; padding: 48px 40px; max-width: 420px; width: 100%;
                     box-shadow: 0 20px 40px rgba(26,24,21,.15); text-align: center; position: relative; overflow: hidden; }

                     background: linear-gradient(90deg, #8b5a3c, #d4a574, #7a8471); }
        .lock { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
                background: linear-gradient(135deg, #8b5a3c, #d4a574);
                display: flex; align-items: center; justify-content: center; }
        .lock svg { width: 30px; height: 30px; fill: #fff; }
        h1 { font-family: 'Crimson Text', serif; font-size: 2rem; margin-bottom: 8px; }
        .sub { color: #6b635a; margin-bottom: 24px; }
        input { width: 100%; padding: 14px 18px; font-size: 1rem; border: 2px solid #e8e4dd; border-radius: 12px;
                outline: none; text-align: center; font-family: inherit; }
        input:focus { border-color: #d4a574; box-shadow: 0 0 0 3px rgba(212,165,116,.2); }
        input.error { border-color: #c9302c; animation: shake .5s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        button { margin-top: 16px; background: linear-gradient(135deg, #8b5a3c, #d4a574); color: #fff; border: none;
                 padding: 14px 44px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        button:disabled { opacity: .6; cursor: wait; }
        .err { display: none; margin-top: 16px; background: rgba(201,48,44,.1); color: #c9302c;
               padding: 12px; border-radius: 8px; font-size: .9rem; }
        .back { margin-top: 20px; font-size: .9rem; }
        .back a { color: #8b5a3c; text-decoration: none; }

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }
        async function unlockVault(passphrase, vault) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64ToBytes(vault.salt), iterations: vault.iter, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(vault.iv) }, key, b64ToBytes(vault.ct));
            return new TextDecoder().decode(pt);
        }
        function rememberPassphrase(pw) { try { sessionStorage.setItem('fp_auth', pw); } catch (e) {} }
        function showGate() { document.getElementById('gateCard').style.visibility = 'visible'; }
        async function go() {
            const input = document.getElementById('pw');
            const btn = document.getElementById('goBtn');
            const err = document.getElementById('err');
            if (!input.value) {
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Unlocking...';
            err.style.display = 'none';
            try {
                const html = await unlockVault(input.value, VAULT);
                rememberPassphrase(input.value);
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Unlock';
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                err.style.display = 'block';
            }
        }
        // Seamless navigation: auto-unlock when this tab already authenticated.
        (async function () {
            let saved = null;
            try { saved = sessionStorage.getItem('fp_auth'); } catch (e) {}
            if (saved) {
                try {
                    const html = await unlockVault(saved, VAULT);
                    document.open();
                    document.write(html);
                    document.close();
                    return;
                } catch (e) { /* fall through to gate */ }
            }
            showGate();
            document.getElementById('pw').focus();
        })();
    </script>
</body>
</html>
