        const LOGIN = "../portal.html";
        function b64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }
        async function unlockVault(passphrase, vault) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64ToBytes(vault.salt), iterations: vault.iter, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(vault.iv) }, key, b64ToBytes(vault.ct));
            return new TextDecoder().decode(pt);
        }

        function withMobileFit(html) {
            if (!/<meta[^>]+name=["']viewport["']/i.test(html)) {
                html = html.replace(/<head([^>]*)>/i, '<head$1><meta name="viewport" content="width=device-width, initial-scale=1">');
            }
            var patch = '<scr' + 'ipt>(function(){'
                + 'function fit(){try{'
                + 'var t=document.getElementById("root")||document.body;'
                + 't.style.zoom="";'
                + 'var vw=document.documentElement.clientWidth||window.innerWidth;'
                + 'var sw=Math.max(t.scrollWidth,document.documentElement.scrollWidth);'
                + 'if(vw&&sw>vw+1){t.style.zoom=(vw/sw);}'
                + '}catch(e){}}'
                + 'var tm;function sched(){clearTimeout(tm);tm=setTimeout(fit,150);}'
                + 'window.addEventListener("resize",sched);'
                + 'window.addEventListener("orientationchange",sched);'
                + 'if(document.readyState==="complete"){fit();}else{window.addEventListener("load",fit);}'
                + 'setTimeout(fit,700);setTimeout(fit,2000);'
                + '})();</scr' + 'ipt>';
            if (/<\/body\s*>/i.test(html)) return html.replace(/<\/body\s*>/i, patch + '</body>');
            if (/<\/html\s*>/i.test(html)) return html.replace(/<\/html\s*>/i, patch + '</html>');
            return html + patch;
        }

        function pagePath() { return location.pathname.replace(/^\//, ''); }
        function sendToLogin() {
            location.replace(LOGIN + '?next=' + encodeURIComponent(pagePath()));
        }
        (async function () {
            let saved = null;
            try { saved = sessionStorage.getItem('fp_auth'); } catch (e) {}
            if (!saved) { sendToLogin(); return; }
            try {
                let html = await unlockVault(saved, VAULT);
                html = withMobileFit(html);
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                // Saved passphrase no longer works: forget it and go to login.
                try { sessionStorage.removeItem('fp_auth'); } catch (e2) {}
                sendToLogin();
            }
        })();
    </script>
