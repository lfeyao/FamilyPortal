<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu Family Lagoon - Secure Family Access</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap');
        
        :root {
            --primary-dark: #1a1815;
            --primary-warm: #8b5a3c;
            --accent-gold: #d4a574;
            --accent-sage: #7a8471;
            --cream: #faf8f3;
            --soft-gray: #e8e4dd;
            --text-primary: #2c2925;
            --text-secondary: #6b635a;
            --danger: #c9302c;
            --success: #5cb85c;
            --shadow-soft: 0 4px 6px rgba(26, 24, 21, 0.07);
            --shadow-medium: 0 10px 25px rgba(26, 24, 21, 0.1);
            --shadow-large: 0 20px 40px rgba(26, 24, 21, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: white;
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-card {
            background: white;
            border-radius: 24px;
            padding: 50px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-large);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-warm), var(--accent-gold), var(--accent-sage));
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary-warm), var(--accent-gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
        }

        .lock-icon.unlocked {
            background: linear-gradient(135deg, var(--success), var(--accent-sage));
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .lock-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-family: 'Crimson Text', serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 35px;
            font-weight: 400;
        }

        .passphrase-container {
            margin: 30px 0;
        }

        .passphrase-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid var(--soft-gray);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            text-align: center;
        }

        .passphrase-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }

        .passphrase-input.error {
            border-color: var(--danger);
            animation: shake 0.5s ease;
        }

        .passphrase-input.success {
            border-color: var(--success);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-unlock {
            background: linear-gradient(135deg, var(--primary-warm), var(--accent-gold));
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-medium);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-unlock:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-large);
        }

        .btn-unlock svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .error-message {
            background: rgba(201, 48, 44, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.3s;
            margin-top: 20px;
        }

        .success-message {
            background: rgba(92, 184, 92, 0.1);
            color: var(--success);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            margin-top: 20px;
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 25px;
            font-style: italic;
        }

        #portalSection {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .portal-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-medium);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .portal-header h2 {
            font-family: 'Crimson Text', serif;
            font-size: 2.2rem;
            color: var(--primary-dark);
        }

        .btn-lock {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-lock:hover {
            background: var(--text-primary);
            transform: translateY(-1px);
        }

        .btn-lock svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .portal-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .portal-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(139, 90, 60, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .portal-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-large);
        }

        .portal-card:hover::after {
            opacity: 1;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-sage), var(--primary-warm));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .card-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .card-description {
            color: var(--text-secondary);
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .welcome-card {
                padding: 35px 25px;
                margin: 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .portal-header {
                padding: 20px;
            }

            .portal-header h2 {
                font-size: 1.8rem;
            }

            .portal-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .welcome-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="portalSection">

            <div class="portal-header">
                <h2>Yu Family Lagoon</h2>
                <a class="btn-lock" href="index.html" style="text-decoration:none">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Lagoon
                </a>
            </div>

            <div class="portal-grid">
                <div class="portal-card" onclick="window.location.href='games/index.html'">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                        </svg>
                    </div>
                    <h3 class="card-title">Games</h3>
                    <p class="card-description">Fun family games, entertainment, and activities for everyone to enjoy.</p>
                </div>

                <div class="portal-card" onclick="window.location.href='resolutions.html'">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                    </div>
                    <h3 class="card-title">New Year Resolutions</h3>
                    <p class="card-description">Family goals and resolutions for each new year.</p>
                </div>

                <div class="portal-card" onclick="window.location.href='holiday-cards.html'">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-7-2l-4-5h3V7h2v5h3l-4 5z"/>
                        </svg>
                    </div>
                    <h3 class="card-title">Holiday Cards</h3>
                    <p class="card-description">Annual family holiday card videos from 2016 to present.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
