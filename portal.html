<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu Family Lagoon - Secure Family Access</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap');
        
        :root {
            --primary-dark: #1a1815;
            --primary-warm: #8b5a3c;
            --accent-gold: #d4a574;
            --accent-sage: #7a8471;
            --cream: #faf8f3;
            --soft-gray: #e8e4dd;
            --text-primary: #2c2925;
            --text-secondary: #6b635a;
            --danger: #c9302c;
            --success: #5cb85c;
            --shadow-soft: 0 4px 6px rgba(26, 24, 21, 0.07);
            --shadow-medium: 0 10px 25px rgba(26, 24, 21, 0.1);
            --shadow-large: 0 20px 40px rgba(26, 24, 21, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: white;
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        #welcomeSection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-card {
            background: white;
            border-radius: 24px;
            padding: 50px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-large);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-warm), var(--accent-gold), var(--accent-sage));
        }

        .lock-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary-warm), var(--accent-gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
        }

        .lock-icon.unlocked {
            background: linear-gradient(135deg, var(--success), var(--accent-sage));
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .lock-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-family: 'Crimson Text', serif;
            font-size: 2.8rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 35px;
            font-weight: 400;
        }

        .passphrase-container {
            margin: 30px 0;
        }

        .passphrase-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid var(--soft-gray);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            text-align: center;
        }

        .passphrase-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }

        .passphrase-input.error {
            border-color: var(--danger);
            animation: shake 0.5s ease;
        }

        .passphrase-input.success {
            border-color: var(--success);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-unlock {
            background: linear-gradient(135deg, var(--primary-warm), var(--accent-gold));
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-medium);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-unlock:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-large);
        }

        .btn-unlock svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .error-message {
            background: rgba(201, 48, 44, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.3s;
            margin-top: 20px;
        }

        .success-message {
            background: rgba(92, 184, 92, 0.1);
            color: var(--success);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            margin-top: 20px;
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 25px;
            font-style: italic;
        }

        #portalSection {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .portal-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-medium);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .portal-header h2 {
            font-family: 'Crimson Text', serif;
            font-size: 2.2rem;
            color: var(--primary-dark);
        }

        .btn-lock {
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-lock:hover {
            background: var(--text-primary);
            transform: translateY(-1px);
        }

        .btn-lock svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .portal-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-medium);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .portal-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(139, 90, 60, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .portal-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-large);
        }

        .portal-card:hover::after {
            opacity: 1;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-sage), var(--primary-warm));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .card-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .card-description {
            color: var(--text-secondary);
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .welcome-card {
                padding: 35px 25px;
                margin: 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .portal-header {
                padding: 20px;
            }

            .portal-header h2 {
                font-size: 1.8rem;
            }

            .portal-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .welcome-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="welcomeSection">
            <div class="welcome-card">
                <div class="lock-icon" id="lockIcon">
                    <svg viewBox="0 0 24 24" id="lockSvg">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <h1>Welcome Home</h1>
                <p class="subtitle">Enter the family passphrase</p>
                
                <div class="passphrase-container">

                        class="passphrase-input"

                        Enter

                </div>
                
                <div class="error-message" id="errorMessage">Incorrect passphrase. Try again!</div>

                <p class="hint-text">Ask a family member if you don't know the passphrase</p>
            </div>
        </div>

        <div id="portalSection" style="display:none"></div>

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }
        async function unlockVault(passphrase, vault) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64ToBytes(vault.salt), iterations: vault.iter, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(vault.iv) }, key, b64ToBytes(vault.ct));
            return new TextDecoder().decode(pt);
        }
        // Initialize
        function init() {
            document.getElementById('passphraseInput').focus();
        }

        // Where to go after login when a protected page bounced here with ?next=.
        // Only same-site relative .html paths are honored (no open redirects).
        function getSafeNext() {
            try {
                const n = new URLSearchParams(location.search).get('next');
                if (n && /^[A-Za-z0-9_\-\.][A-Za-z0-9_\-\/.]*\.html$/.test(n) && n.indexOf('..') === -1 && n.charAt(0) !== '/') return n;
            } catch (e) {}
            return null;
        }

        async function tryUnlock() {
            const input = document.getElementById('passphraseInput');
            const passphrase = input.value;
            const btn = document.querySelector('.btn-unlock');

            if (!passphrase) {
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                return;
            }

            btn.disabled = true;
            const originalBtn = btn.innerHTML;
            btn.innerHTML = 'Unlocking...';
            document.getElementById('errorMessage').style.display = 'none';

            try {
                const html = await unlockVault(passphrase, VAULT);
                input.classList.remove('error');
                input.classList.add('success');
                document.getElementById('lockIcon').classList.add('unlocked');
                document.getElementById('lockSvg').innerHTML = '<path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>';
                document.getElementById('successMessage').style.display = 'block';
                try { sessionStorage.setItem('fp_auth', passphrase); } catch (e) {}
                input.value = '';

                const next = getSafeNext();
                if (next) {
                    setTimeout(() => { location.href = next; }, 900);
                    return;
                }

                setTimeout(() => {
                    document.getElementById('welcomeSection').style.display = 'none';
                    const portal = document.getElementById('portalSection');
                    portal.innerHTML = html;
                    portal.style.display = 'block';
                }, 1000);
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = originalBtn;
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('successMessage').style.display = 'none';
            }
        }

        function lockPortal() {
            try { sessionStorage.removeItem('fp_auth'); } catch (e) {}
            document.getElementById('portalSection').innerHTML = '';
            document.getElementById('portalSection').style.display = 'none';
            document.getElementById('welcomeSection').style.display = 'flex';
            document.getElementById('lockIcon').classList.remove('unlocked');
            document.getElementById('lockSvg').innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>';
            document.getElementById('passphraseInput').value = '';
            document.getElementById('passphraseInput').classList.remove('success');
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function openSection(section) {
            alert(`Opening ${section} section...`);
        }

        window.onload = init;

        // Seamless navigation: if this tab already unlocked, skip the gate.
        (function () {
            let saved = null;
            try { saved = sessionStorage.getItem('fp_auth'); } catch (e) {}
            if (saved) {
                const next = getSafeNext();
                if (next) { location.href = next; return; }
                document.getElementById('passphraseInput').value = saved;
                tryUnlock();
            }
        })();
    </script>
    <script>
        // Mobile auto-fit: shrink the page only when its content is wider than
        // the viewport (narrow phones). Desktop rendering is untouched.
        (function () {
            function fit() {
                try {
                    var t = document.getElementById('root') || document.body;
                    t.style.zoom = '';
                    var vw = document.documentElement.clientWidth || window.innerWidth;
                    var sw = Math.max(t.scrollWidth, document.documentElement.scrollWidth);
                    if (vw && sw > vw + 1) { t.style.zoom = (vw / sw); }
                } catch (e) {}
            }
            var tm;
            function sched() { clearTimeout(tm); tm = setTimeout(fit, 150); }
            window.addEventListener('resize', sched);
            window.addEventListener('orientationchange', sched);
            if (document.readyState === 'complete') { fit(); } else { window.addEventListener('load', fit); }
            setTimeout(fit, 700);
            setTimeout(fit, 2000);
        })();
    </script>
</body>
